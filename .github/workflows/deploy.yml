name: Build & Deploy

# Équivalent GitHub du .gitlab-ci.yml : un push sur develop/preprod/prod build
# les deux images (medical, partenaires), les pousse sur GHCR, puis déploie
# via Helmfile sur le cluster K8s de la branche.
#
# Les variables par branche (ex-workflow rules GitLab) vivent maintenant dans
# les GitHub Environments "develop" / "preprod" / "prod" (Settings > Environments) :
# mêmes noms que les variables GitLab d'origine, en Environment variables (vars.*).
# Voir docs/DEPLOYMENT.md pour la liste complète et les secrets requis.

on:
  push:
    branches: main

env:
  HOST: ${{ 
    github.ref_name == 'develop' && 'develop.medical-place.com' ||
    github.ref_name == 'preprod' && 'preprod.medical-place.com' ||
    github.ref_name == 'prod' && 'medical-place.com' ||
    github.ref_name == 'main' && 'google.com'
  }}
  DOMAIN: https://${{ env.HOST }}

jobs:
  build:
    strategy:
      matrix:
        app: [medical, partenaires]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.${{ matrix.app }}
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.app }}:${{ github.sha }}
          build-args: |
            DOMAIN=${{ env.DOMAIN }}
            HOST=${{ env.HOST }}
